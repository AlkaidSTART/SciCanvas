[package]
name = "scicanvas"
version = "0.1.0"
description = "SciCanvas 智研活体沙盒"
authors = ["SciCanvas"]
edition = "2021"

[lib]
name = "scicanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
